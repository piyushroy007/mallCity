<mat-card class="app-reusable-card glass-panel">
  <div class="image-wrapper" *ngIf="imageUrl">
    <img mat-card-image [src]="imageUrl" [alt]="title" loading="lazy" (error)="onImageError($event)" />
    <div class="badge-overlay" *ngIf="badge">{{ badge }}</div>
  </div>

  <mat-card-header *ngIf="title">
    <mat-card-title class="card-title">{{ title }}</mat-card-title>
    <mat-card-subtitle *ngIf="subtitle" class="card-subtitle">{{ subtitle }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content *ngIf="content" class="card-body">
    <p>{{ content }}</p>
  </mat-card-content>

  <mat-card-actions class="card-actions">
    <ng-content select="[actions]"></ng-content>
  </mat-card-actions>
</mat-card>
